# Config for gundamFitter: starting based on screenshots on sbn-doc-32028... let's see

outputFolder: "${GUNDAM_CONFIG_DIR}/output_CalcXsec/"
minGundamVersion: 1.9.0

xsecCalcConfig:
  enableStatThrowInToys: true
  enableEventMcThrow: true

fitterEngineConfig:

  # minimizer
  minimizerConfig: "${GUNDAM_CONFIG_DIR}/Configs_Minimizer/default_minimizer.yaml"

  # likelihoodInterface
  likelihoodInterfaceConfig:

    SkipInitialLLHCalc: true

    # jointProbability
    jointProbabilityConfig:
      type: "StatCovariance"

    # dataSetManager
    propagatorConfig:
      # use --fitsample-config to update
      fitSampleSetConfig: "${GUNDAM_CONFIG_DIR}/Configs_FitSampleSet/MuonPLT0p8/fitSamples_TruedeltaPT_and_TruedeltaalphaT.yaml"
      parametersManagerConfig:
        parameterSetList: "${GUNDAM_CONFIG_DIR}/Configs_ParameterSetList/parameterSetList_deltaPT_and_deltaalphaT.yaml"

    dataSetList: "${GUNDAM_CONFIG_DIR}/Configs_DataSetList/dataSetListConfig_True.yaml"

    # use --plot-config to update
    plotGeneratorConfig: "${GUNDAM_CONFIG_DIR}/Configs_PlotGenerator/plotConfigs_TruedeltaPT_and_TruedeltaalphaT.yaml"


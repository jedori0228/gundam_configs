fitSampleList:
  - name: "SignalSelection_Contained_RecoMuonProtonCos"
    isEnabled: true
    binning: "${GUNDAM_CONFIG_DIR}/binnings/binning_RecoMuonProtonCos.txt"
    selectionCuts: "CutType==1 && MuonTrackType==1"
    dataSets: ["ICARUSNuMI_1muNp0pi_Reco_Dataset1"]
  - name: "Sideband_Contained_RecoMuonProtonCos"
    isEnabled: true
    binning: "${GUNDAM_CONFIG_DIR}/binnings/binning_RecoMuonProtonCos.txt"
    selectionCuts: "CutType==2 && MuonTrackType==1 && LeadingChargedPionCandidateLength>=10."
    dataSets: ["ICARUSNuMI_1muNp0pi_Reco_Dataset1"]
  - name: "SignalSelection_Exiting_RecoMuonProtonCos"
    isEnabled: true
    binning: "${GUNDAM_CONFIG_DIR}/binnings/binning_RecoMuonProtonCos.txt"
    selectionCuts: "CutType==1 && MuonTrackType!=1"
    dataSets: ["ICARUSNuMI_1muNp0pi_Reco_Dataset1"]
  - name: "Sideband_Exiting_RecoMuonProtonCos"
    isEnabled: true
    binning: "${GUNDAM_CONFIG_DIR}/binnings/binning_RecoMuonProtonCos.txt"
    selectionCuts: "CutType==2 && MuonTrackType!=1 && LeadingChargedPionCandidateLength>=10."
    dataSets: ["ICARUSNuMI_1muNp0pi_Reco_Dataset1"]
